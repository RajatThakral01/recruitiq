<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>RecruitIQ - AI-Powered Talent Curation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7C3AED",
                        "primary-container": "#7C3AED",
                        "on-primary-container": "#ede0ff",
                        "background": "#0A0A0F",
                        "surface": "#12121A",
                        "surface-container": "#1B1B25",
                        "surface-container-low": "#1b1b20",
                        "surface-container-lowest": "#0e0e13",
                        "on-surface": "#E4E1E9",
                        "on-surface-variant": "#ccc3d8",
                        "outline": "#958DA1",
                        "secondary": "#4EDE93",
                        "tertiary": "#FFB3AD",
                        "error": "#FFB4AB"
                    },
                    fontFamily: {
                        "body": ["Inter", "sans-serif"],
                    },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0F; color: #E4E1E9; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes progress-loading {
            0% { width: 0%; }
            20% { width: 25%; }
            50% { width: 60%; }
            80% { width: 85%; }
            100% { width: 100%; }
        }
        @keyframes pulse-subtext {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-spin-custom { animation: spin-slow 1.5s linear infinite; }
        .animate-progress { animation: progress-loading 4s ease-in-out forwards; }
        .animate-pulse-subtext { animation: pulse-subtext 2s ease-in-out infinite; }
        .ghost-border { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05); }
    </style>
    
    <!-- React & Router Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate } = ReactRouterDOM;

        // --- Components ---

        const TopNav = () => {
            const navigate = useNavigate();
            const location = ReactRouterDOM.useLocation();
            const stateResults = location.state && location.state.results;
            const storedResults = sessionStorage.getItem('recruitiq_results');
            const hasResults = (stateResults && stateResults.results && stateResults.results.length > 0) || 
                               (storedResults && JSON.parse(storedResults).results && JSON.parse(storedResults).results.length > 0);

            const handleViewResults = (e) => {
                e.preventDefault();
                const stored = sessionStorage.getItem('recruitiq_results');
                if (stored) {
                    navigate('/results', {state: {results: JSON.parse(stored)}});
                } else {
                    navigate('/');
                }
            };

            return (
                <header className="bg-[#0A0A0F]/80 backdrop-blur-md border-b border-white/5 fixed top-0 left-0 right-0 z-40">
                    <div className="flex justify-between items-center w-full px-8 h-16 max-w-[1920px] mx-auto">
                        <Link to="/" className="flex items-center gap-2 text-xl font-bold text-[#E4E1E9]">
                            <span className="text-primary material-symbols-outlined" style={{fontVariationSettings: "'FILL' 1"}}>bolt</span>
                            RecruitIQ
                        </Link>
                        <nav className="hidden md:flex items-center gap-8 text-sm font-medium">
                            <Link to="/" className="text-outline hover:text-on-surface transition-colors">How it works</Link>
                            <Link 
                                to="/results" 
                                onClick={handleViewResults}
                                className={hasResults ? "text-primary border-b-2 border-primary pb-1" : "text-outline hover:text-on-surface transition-colors"}
                            >
                                View Results
                            </Link>
                        </nav>
                        <div className="flex items-center gap-4">
                            <button className="material-symbols-outlined text-outline hover:bg-white/5 p-2 rounded-full transition-all">account_circle</button>
                        </div>
                    </div>
                </header>
            );
        };

        // --- Pages ---

        // Screen 1: Home/Upload
        const API_BASE = window.location.origin;

        const HomePage = () => {
            const navigate = useNavigate();
            const [jdFile, setJdFile] = React.useState(null);
            const [resumeFiles, setResumeFiles] = React.useState([]);
            const [error, setError] = React.useState(null);
            const [isLoading, setIsLoading] = React.useState(false);
            const [jdInputMode, setJdInputMode] = React.useState('file');
            const [llmProvider, setLlmProvider] = React.useState('mistral');
            const [jdPastedText, setJdPastedText] = React.useState('');
            const jdInputRef = React.useRef(null);
            const resumeInputRef = React.useRef(null);

            const handleProviderSwitch = async (provider) => {
                setLlmProvider(provider);
                try {
                    await fetch(API_BASE + "/api/config/provider", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({provider})
                    });
                } catch(err) {
                    console.error("Provider switch failed:", err);
                }
            };

            const handleJdSelect = (file) => {
                if (file && (file.name.endsWith('.pdf') || file.name.endsWith('.txt'))) {
                    setJdFile(file);
                } else {
                    setError("JD must be a PDF or TXT file");
                }
            };

            const handleResumeSelect = (files) => {
                const pdfs = Array.from(files).filter(f => f.name.endsWith('.pdf'));
                if (pdfs.length === 0) { setError("Only PDF files accepted"); return; }
                setResumeFiles(prev => {
                    const combined = [...prev, ...pdfs];
                    return combined.slice(0, 10);
                });
            };

            const handleScreen = async () => {
                const hasJD = jdInputMode === 'file' ? !!jdFile : jdPastedText.trim().length > 50;
                if (!hasJD || resumeFiles.length === 0) return;
                setIsLoading(true);
                setError(null);
                try {
                    const jdForm = new FormData();
                    if (jdInputMode === 'paste') {
                        const blob = new Blob([jdPastedText], {type: 'text/plain'});
                        const textFile = new File([blob], 'job_description.txt', {type: 'text/plain'});
                        jdForm.append("file", textFile);
                    } else {
                        jdForm.append("file", jdFile);
                    }
                    const jdRes = await fetch(API_BASE + "/api/upload/jd", {method:"POST", body:jdForm});
                    if (!jdRes.ok) throw new Error("JD upload failed");
                    const jdData = await jdRes.json();

                    const resumeForm = new FormData();
                    resumeFiles.forEach(f => resumeForm.append("files", f));
                    const resumeRes = await fetch(API_BASE + "/api/upload/resumes", {method:"POST", body:resumeForm});
                    if (!resumeRes.ok) throw new Error("Resume upload failed");
                    const resumeData = await resumeRes.json();

                    const screenRes = await fetch(API_BASE + "/api/screen", {
                        method:"POST",
                        headers:{"Content-Type":"application/json"},
                        body:JSON.stringify({jd_id: jdData.jd_id, resume_ids: resumeData.resume_ids})
                    });
                    if (!screenRes.ok) throw new Error("Screening failed");
                    const results = await screenRes.json();
                    sessionStorage.setItem('recruitiq_results', JSON.stringify(results));
                    navigate('/results', {state: {results}});
                } catch(err) {
                    setError(err.message);
                    setIsLoading(false);
                }
            };

            const hasJD = jdInputMode === 'file' ? !!jdFile : jdPastedText.trim().length > 50;

            return (
                <div className="min-h-screen flex flex-col items-center justify-center pt-24 pb-16 px-6 bg-background relative overflow-hidden">
                    <TopNav />
                    {error && (
                        <div style={{position:'fixed',top:'80px',left:'50%',transform:'translateX(-50%)',background:'#1F2937',border:'1px solid #EF4444',borderRadius:'8px',padding:'12px 20px',color:'#EF4444',zIndex:9999,maxWidth:'500px'}}>
                            {error} <button onClick={() => setError(null)} style={{marginLeft:'12px',color:'#EF4444',background:'none',border:'none',cursor:'pointer'}}>✕</button>
                        </div>
                    )}
                    <input ref={jdInputRef} type="file" accept=".pdf,.txt" style={{display:'none'}} onChange={e => e.target.files[0] && handleJdSelect(e.target.files[0])} />
                    <input ref={resumeInputRef} type="file" accept=".pdf" multiple style={{display:'none'}} onChange={e => handleResumeSelect(e.target.files)} />
                    <main className="z-10 flex flex-col items-center w-full">
                        <header className="text-center mb-12 max-w-2xl">
                            <span className="text-primary-container text-[11px] font-medium tracking-[0.15em] uppercase mb-4 block">
                                AI-Powered Hiring
                            </span>
                            <h1 className="text-4xl md:text-5xl lg:text-6xl font-extrabold text-on-surface leading-[1.15] mb-6 tracking-tight">
                                Screen resumes in seconds, not hours
                            </h1>
                            <p className="text-on-surface-variant text-base md:text-lg max-w-lg mx-auto leading-relaxed">
                                Upload a job description and up to 10 resumes. RecruitIQ scores, ranks, and explains every candidate using AI.
                            </p>
                        </header>

                        <div className="w-full max-w-[860px] grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <section className="flex flex-col gap-3">
                                <div className="flex justify-between items-center px-1">
                                    <label className="text-sm font-semibold text-on-surface">Job Description</label>
                                    <div className="flex items-center gap-1 p-0.5 rounded-full" style={{border:'1px solid rgba(255,255,255,0.1)'}}>
                                        <button
                                            onClick={() => { setJdInputMode('file'); setJdPastedText(''); }}
                                            style={{
                                                padding:'3px 12px',
                                                borderRadius:'9999px',
                                                fontSize:'11px',
                                                fontWeight:'600',
                                                border:'none',
                                                cursor:'pointer',
                                                background: jdInputMode === 'file' ? '#7C3AED' : 'transparent',
                                                color: jdInputMode === 'file' ? '#fff' : 'rgba(255,255,255,0.4)',
                                                transition:'all 0.2s'
                                            }}
                                        >Upload File</button>
                                        <button
                                            onClick={() => { setJdInputMode('paste'); setJdFile(null); }}
                                            style={{
                                                padding:'3px 12px',
                                                borderRadius:'9999px',
                                                fontSize:'11px',
                                                fontWeight:'600',
                                                border:'none',
                                                cursor:'pointer',
                                                background: jdInputMode === 'paste' ? '#7C3AED' : 'transparent',
                                                color: jdInputMode === 'paste' ? '#fff' : 'rgba(255,255,255,0.4)',
                                                transition:'all 0.2s'
                                            }}
                                        >Paste Text</button>
                                    </div>
                                </div>
                                {jdInputMode === 'file' ? (
                                    <React.Fragment>
                                        <div onClick={() => jdInputRef.current.click()} onDragOver={e => e.preventDefault()} onDrop={e => { e.preventDefault(); handleJdSelect(e.dataTransfer.files[0]); }} className="h-[180px] bg-primary-container/5 border-2 border-dashed border-primary-container/40 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-primary-container/10 transition-all duration-300 hover:border-primary-container/60">
                                            <span className="material-symbols-outlined text-primary-container text-4xl mb-3">description</span>
                                            <span className="text-on-surface font-medium text-[15px]">Drop your JD here</span>
                                            <span className="text-outline text-xs mt-1">PDF or TXT, max 5MB</span>
                                        </div>
                                        {jdFile && (
                                            <div className="flex items-center gap-2 bg-primary-container/20 px-3 py-1.5 rounded-full w-fit mt-1">
                                                <span className="text-xs font-medium text-primary">{jdFile.name}</span>
                                                <button onClick={() => setJdFile(null)} className="material-symbols-outlined text-xs text-primary/70 hover:text-primary">close</button>
                                            </div>
                                        )}
                                    </React.Fragment>
                                ) : (
                                    <React.Fragment>
                                        <textarea
                                            value={jdPastedText}
                                            onChange={e => setJdPastedText(e.target.value)}
                                            placeholder="Paste your job description here..."
                                            style={{
                                                height:'180px',
                                                background:'rgba(124,58,237,0.04)',
                                                border:'2px solid rgba(124,58,237,0.4)',
                                                borderRadius:'12px',
                                                padding:'16px',
                                                color:'#fff',
                                                fontSize:'14px',
                                                resize:'none',
                                                width:'100%',
                                                outline:'none',
                                                fontFamily:'inherit',
                                                lineHeight:'1.5',
                                                boxSizing:'border-box'
                                            }}
                                        />
                                        <span style={{fontSize:'12px',color:'rgba(255,255,255,0.3)',paddingLeft:'2px'}}>
                                            {jdPastedText.length} characters
                                        </span>
                                    </React.Fragment>
                                )}
                            </section>

                            <section className="flex flex-col gap-3 group">
                                <div className="flex justify-between items-center px-1">
                                    <label className="text-sm font-semibold text-on-surface flex items-center gap-2">
                                        Resumes
                                        <span className="px-2 py-0.5 bg-primary-container/20 text-primary-container text-[10px] font-bold rounded-full">{resumeFiles.length}/10</span>
                                    </label>
                                </div>
                                <div onClick={() => resumeInputRef.current.click()} onDragOver={e => e.preventDefault()} onDrop={e => { e.preventDefault(); handleResumeSelect(e.dataTransfer.files); }} className="h-[180px] bg-primary-container/5 border-2 border-dashed border-primary-container/40 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-primary-container/10 transition-all duration-300 group-hover:border-primary-container/60">
                                    <span className="material-symbols-outlined text-primary-container text-4xl mb-3">layers</span>
                                    <span className="text-on-surface font-medium text-[15px]">Drop resumes here</span>
                                    <span className="text-outline text-xs mt-1 text-center px-4">PDF only · Up to 10 files · Max 10MB each</span>
                                </div>
                                <div className="grid grid-cols-1 gap-2 mt-1">
                                    {resumeFiles.slice(0,2).map((f,i) => (
                                        <div key={i} className="flex items-center justify-between bg-surface-container-low p-2 rounded-lg ghost-border">
                                            <div className="flex items-center gap-3">
                                                <div className="w-7 h-7 bg-primary-container rounded flex items-center justify-center text-[10px] font-bold text-white">{f.name.substring(0,2).toUpperCase()}</div>
                                                <div className="flex flex-col">
                                                    <span className="text-xs font-medium text-on-surface truncate max-w-[120px]">{f.name}</span>
                                                    <span className="text-[10px] text-outline">{(f.size/1024).toFixed(0)} KB</span>
                                                </div>
                                            </div>
                                            <button onClick={() => setResumeFiles(prev => prev.filter((_,j) => j !== i))} className="material-symbols-outlined text-outline hover:text-error transition-colors text-lg">close</button>
                                        </div>
                                    ))}
                                    {resumeFiles.length > 2 && (
                                        <div className="flex items-center gap-2 px-2">
                                            <span className="text-[10px] font-bold text-outline uppercase tracking-wider">+ {resumeFiles.length - 2} more candidate{resumeFiles.length - 2 > 1 ? 's' : ''}</span>
                                        </div>
                                    )}
                                </div>
                            </section>
                        </div>

                        <div className="w-full max-w-[860px] flex flex-col items-center gap-6">
                            <div style={{display:'flex',alignItems:'center',gap:'12px',alignSelf:'flex-start'}}>
                                <span style={{fontSize:'12px',color:'rgba(255,255,255,0.4)',fontWeight:'500'}}>LLM Provider</span>
                                <div style={{display:'flex',alignItems:'center',gap:'4px',padding:'3px',borderRadius:'9999px',border:'1px solid rgba(255,255,255,0.1)'}}>
                                    <button
                                        onClick={() => handleProviderSwitch('mistral')}
                                        style={{
                                            padding:'4px 14px',
                                            borderRadius:'9999px',
                                            fontSize:'11px',
                                            fontWeight:'600',
                                            border:'none',
                                            cursor:'pointer',
                                            background: llmProvider === 'mistral' ? '#7C3AED' : 'transparent',
                                            color: llmProvider === 'mistral' ? '#fff' : 'rgba(255,255,255,0.4)',
                                            transition:'all 0.2s'
                                        }}
                                    >Mistral</button>
                                    <button
                                        onClick={() => handleProviderSwitch('groq')}
                                        style={{
                                            padding:'4px 14px',
                                            borderRadius:'9999px',
                                            fontSize:'11px',
                                            fontWeight:'600',
                                            border:'none',
                                            cursor:'pointer',
                                            background: llmProvider === 'groq' ? '#7C3AED' : 'transparent',
                                            color: llmProvider === 'groq' ? '#fff' : 'rgba(255,255,255,0.4)',
                                            transition:'all 0.2s'
                                        }}
                                    >Groq</button>
                                </div>
                            </div>
                            <button 
                                onClick={handleScreen}
                                disabled={!hasJD || resumeFiles.length === 0 || isLoading}
                                className="w-full h-[52px] bg-primary-container hover:bg-[#6D28D9] text-white font-semibold rounded-lg flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20 transition-all duration-200 active:scale-[0.98]"
                                style={{opacity: (!hasJD || resumeFiles.length === 0 || isLoading) ? 0.4 : 1, cursor: (!hasJD || resumeFiles.length === 0 || isLoading) ? 'not-allowed' : 'pointer'}}
                            >
                                {isLoading ? 'Processing...' : 'Screen Candidates'}
                                <span className="material-symbols-outlined text-xl">{isLoading ? 'hourglass_empty' : 'arrow_forward'}</span>
                            </button>
                            <div className="flex flex-wrap items-center justify-center gap-x-6 gap-y-2">
                                <div className="flex items-center gap-1.5 text-outline text-[12px]">
                                    <span className="material-symbols-outlined text-sm">lock</span>
                                    Secure upload
                                </div>
                                <div className="flex items-center gap-1.5 text-outline text-[12px]">
                                    <span className="material-symbols-outlined text-sm">bolt</span>
                                    Results in ~30s
                                </div>
                                <div className="flex items-center gap-1.5 text-outline text-[12px]">
                                    <span className="material-symbols-outlined text-sm">smart_toy</span>
                                    Claude AI
                                </div>
                            </div>
                        </div>
                    </main>
                    
                    <div className="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 blur-[120px] rounded-full -z-10"></div>
                    <div className="fixed bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-secondary/5 blur-[100px] rounded-full -z-10"></div>
                </div>
            );
        };

        // Screen 2: Processing
        const ProcessingPage = () => {
            const navigate = useNavigate();
            const steps = [
                "Extracting text from resumes...",
                "Parsing job requirements...",
                "Running ATS keyword analysis...",
                "Scoring semantic match...",
                "Generating recommendations..."
            ];
            const [currentStep, setCurrentStep] = useState(0);

            useEffect(() => {
                const stepInterval = setInterval(() => {
                    setCurrentStep(prev => (prev + 1) % steps.length);
                }, 800);

                const navTimeout = setTimeout(() => {
                    navigate('/results');
                }, 4000);

                return () => {
                    clearInterval(stepInterval);
                    clearTimeout(navTimeout);
                };
            }, [navigate, steps.length]);

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-background">
                     <header className="bg-[#131318] flex justify-between items-center w-full px-8 h-16 max-w-[1920px] mx-auto fixed top-0 left-0 z-50">
                        <div className="flex items-center gap-2 text-xl font-bold text-[#E4E1E9]">
                            <span className="material-symbols-outlined text-[#7C3AED]" style={{fontVariationSettings: "'FILL' 1"}}>insights</span>
                            RecruitIQ
                        </div>
                        <div className="flex items-center gap-6">
                            <span className="text-[#958DA1] font-['Inter'] antialiased text-sm tracking-wide">Processing Analysis</span>
                        </div>
                    </header>

                    <main className="flex-grow flex items-center justify-center p-6 mt-16 w-full">
                        <div className="w-full max-w-2xl text-center space-y-12">
                            <div className="relative flex justify-center">
                                <div className="absolute inset-0 bg-primary-container/20 blur-[80px] rounded-full w-48 h-48 mx-auto -z-10"></div>
                                <div className="relative w-24 h-24 flex items-center justify-center">
                                    <div className="absolute inset-0 border-[3px] border-primary-container/10 rounded-full"></div>
                                    <div className="absolute inset-0 border-[3px] border-transparent border-t-primary-container border-r-primary-container rounded-full animate-spin-custom"></div>
                                    <span className="material-symbols-outlined text-primary text-3xl">psychology</span>
                                </div>
                            </div>
                            
                            <div className="space-y-4">
                                <h1 className="text-2xl font-semibold tracking-tight text-on-surface">Analyzing candidates...</h1>
                                <div className="h-6 flex items-center justify-center">
                                    <p className="text-on-surface-variant font-medium text-sm animate-pulse-subtext">
                                        {steps[currentStep]}
                                    </p>
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="glass-panel p-8 rounded-xl space-y-4 text-left">
                                    <div className="flex justify-between items-end mb-1">
                                        <span className="text-[10px] uppercase tracking-[0.05rem] font-bold text-outline">Engine Status: Active</span>
                                        <span className="text-xs font-mono text-primary">SCANNING...</span>
                                    </div>
                                    <div className="w-full h-2 bg-surface-container-lowest rounded-full overflow-hidden">
                                        <div className="h-full bg-primary-container rounded-full animate-progress" style={{boxShadow: "0 0 12px rgba(124, 58, 237, 0.4)"}}></div>
                                    </div>
                                    <p className="text-sm text-outline font-medium pt-2 text-center">
                                        Processing your candidates...
                                    </p>
                                </div>
                                
                                <div className="grid grid-cols-3 gap-4 opacity-40">
                                    <div className="flex flex-col items-center gap-1">
                                        <span className="text-[10px] uppercase tracking-widest text-outline">Latency</span>
                                        <span className="text-xs font-mono">124ms</span>
                                    </div>
                                    <div className="flex flex-col items-center gap-1 border-x border-white/5">
                                        <span className="text-[10px] uppercase tracking-widest text-outline">Tokens</span>
                                        <span className="text-xs font-mono">1.4M</span>
                                    </div>
                                    <div className="flex flex-col items-center gap-1">
                                        <span className="text-[10px] uppercase tracking-widest text-outline">Accuracy</span>
                                        <span className="text-xs font-mono">99.8%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                    
                    <footer className="p-8 text-center">
                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-surface-container-low rounded-full">
                            <div className="w-2 h-2 rounded-full bg-secondary animate-pulse"></div>

                        <Route path="/results" element={<ResultsPage />} />
                        <Route path="/profile" element={<ProfilePage />} />
                    </Routes>
                </MemoryRouter>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
