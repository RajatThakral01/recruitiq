services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://recruitiq:recruitiq@db:5432/recruitiq
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: recruitiq
      POSTGRES_PASSWORD: recruitiq
      POSTGRES_DB: recruitiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitiq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
